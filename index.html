<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario and Luigi Brotherships</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #5c94fc 0%, #5c94fc 70%, #000 70%);
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            border: 4px solid #000;
            background: #5c94fc;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #info {
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
        .controls {
            color: white;
            margin-top: 10px;
            font-size: 12px;
        }
        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
        }
        .authors {
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .authors-title {
            font-weight: bold;
            color: #ffff00;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="title">MARIO AND LUIGI BROTHERSHIPS</div>
        <div class="authors">
            <div class="authors-title">Created by:</div>
            <div>Mohammad Musa</div>
            <div>Abdul Haadi</div>
            <div>Abdul Rafay</div>
            <div>Khursheed Ahmad</div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="info">
            <div>Arrow Keys: Move Left/Right | Space: Jump</div>
            <div>Hit question blocks from below for coins!</div>
        </div>
        <div class="controls">Press R to restart | Reach the flag at the end!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const GRAVITY = 0.5;
        const JUMP_STRENGTH = -12;
        const MOVE_SPEED = 5;
        const PLAYER_WIDTH = 32;
        const PLAYER_HEIGHT = 48;
        const LEVEL_WIDTH = 6000; // Long level

        // Camera
        let camera = {
            x: 0,
            y: 0
        };

        // Keys pressed
        const keys = {};

        // Game state
        let score = 0;
        let levelComplete = false;
        let lives = 3;
        let deaths = 0;
        let lastSafePosition = { x: 100, y: 100 };
        let flagReached = false;
        let marioRunning = false;
        let fireworks = [];
        let gameStartTime = Date.now();
        let gameTime = 0;
        let marioInCastle = false;

        // Player class
        class Player {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.width = PLAYER_WIDTH;
                this.height = PLAYER_HEIGHT;
                this.velocityX = 0;
                this.velocityY = 0;
                this.color = color;
                this.onGround = false;
                this.direction = 1;
                this.slidingFlag = false;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Body (overalls)
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(screenX + 8, screenY + 20, 16, 20);

                // Head (skin)
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(screenX + 8, screenY + 8, 16, 12);

                // Hat
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX + 6, screenY + 4, 20, 8);

                // Shirt under overalls
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX + 8, screenY + 20, 16, 6);

                // Legs
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(screenX + 10, screenY + 40, 6, 8);
                ctx.fillRect(screenX + 18, screenY + 40, 6, 8);

                // Shoes
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX + 8, screenY + 44, 8, 4);
                ctx.fillRect(screenX + 16, screenY + 44, 8, 4);

                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(screenX + 10, screenY + 12, 3, 3);
                ctx.fillRect(screenX + 19, screenY + 12, 3, 3);

                // Mustache
                ctx.fillStyle = '#000';
                ctx.fillRect(screenX + 8, screenY + 18, 16, 2);

                // Arms
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX + 4, screenY + 24, 4, 10);
                ctx.fillRect(screenX + 24, screenY + 24, 4, 10);
            }

            update() {
                // Don't update if sliding on flag
                if (this.slidingFlag) {
                    return;
                }

                // Auto-run to castle when flag is reached
                if (marioRunning) {
                    this.velocityX = MOVE_SPEED;
                    this.direction = 1;
                } else {
                    // Handle input
                    if (keys['ArrowLeft']) {
                        this.velocityX = -MOVE_SPEED;
                        this.direction = -1;
                    } else if (keys['ArrowRight']) {
                        this.velocityX = MOVE_SPEED;
                        this.direction = 1;
                    } else {
                        this.velocityX = 0;
                    }

                    if (keys[' '] && this.onGround) {
                        this.velocityY = JUMP_STRENGTH;
                        this.onGround = false;
                    }
                }

                // Apply gravity
                this.velocityY += GRAVITY;

                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Keep in bounds (horizontal)
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > LEVEL_WIDTH) this.x = LEVEL_WIDTH - this.width;

                // Reset if fell off screen (pit) - continue from same location
                if (this.y > 700) {
                    // Track deaths for statistics
                    deaths++;

                    // Respawn at last safe position
                    this.x = lastSafePosition.x;
                    this.y = lastSafePosition.y;
                    this.velocityX = 0;
                    this.velocityY = 0;
                }

                // Check collision with platforms
                this.onGround = false;
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        // Top collision (landing on platform)
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;

                            // Update last safe position when on ground
                            lastSafePosition.x = this.x;
                            lastSafePosition.y = this.y;
                        }
                        // Bottom collision (hitting head)
                        else if (this.velocityY < 0 && this.y - this.velocityY >= platform.y + platform.height) {
                            this.y = platform.y + platform.height;
                            this.velocityY = 0;
                        }
                        // Side collisions
                        else {
                            if (this.velocityX > 0) {
                                this.x = platform.x - this.width;
                            } else if (this.velocityX < 0) {
                                this.x = platform.x + platform.width;
                            }
                        }
                    }
                });

                // Check collision with question blocks
                questionBlocks.forEach(block => {
                    // Check for hit from below
                    if (block.checkHit(this)) {
                        score += 10;
                    }

                    // Check platform collision (standing on top)
                    if (block.checkCollision(this)) {
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= block.y) {
                            this.y = block.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;

                            // Update last safe position when on ground
                            lastSafePosition.x = this.x;
                            lastSafePosition.y = this.y;
                        }
                    }
                });

                // Update camera to follow player
                camera.x = this.x - canvas.width / 3;
                if (camera.x < 0) camera.x = 0;
                if (camera.x > LEVEL_WIDTH - canvas.width) camera.x = LEVEL_WIDTH - canvas.width;
            }

            checkCollision(platform) {
                return this.x < platform.x + platform.width &&
                       this.x + this.width > platform.x &&
                       this.y < platform.y + platform.height &&
                       this.y + this.height > platform.y;
            }
        }

        // Platform class
        class Platform {
            constructor(x, y, width, height, color = '#8B4513') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Only draw if on screen
                if (screenX + this.width < 0 || screenX > canvas.width) return;

                // Main platform
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX, screenY, this.width, this.height);

                // Add brick pattern
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                const brickWidth = 40;
                const brickHeight = 20;

                for (let x = 0; x < this.width; x += brickWidth) {
                    for (let y = 0; y < this.height; y += brickHeight) {
                        ctx.strokeRect(screenX + x, screenY + y, brickWidth, brickHeight);
                    }
                }
            }
        }

        // Coin class
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.collected = false;
            }

            draw() {
                if (!this.collected) {
                    const screenX = this.x - camera.x;
                    const screenY = this.y - camera.y;

                    // Only draw if on screen
                    if (screenX < -20 || screenX > canvas.width + 20) return;

                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            checkCollection(player) {
                if (!this.collected) {
                    const dx = this.x - (player.x + player.width / 2);
                    const dy = this.y - (player.y + player.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < this.radius + player.width / 2) {
                        this.collected = true;
                        return true;
                    }
                }
                return false;
            }
        }

        // Mario Flag class - flag rises when touched
        class Flag {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 12;
                this.height = 250;
                this.flagWidth = 60;
                this.flagHeight = 40;
                this.waveOffset = 0;
                this.flagY = this.height - this.flagHeight - 10; // Flag starts at bottom
                this.isRising = false;
                this.riseSpeed = 3;
                this.reached = false;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Pole base
                ctx.fillStyle = '#888';
                ctx.fillRect(screenX - 8, screenY + this.height, 28, 15);

                // Pole shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(screenX + 2, screenY + 2, this.width, this.height);

                // Main pole
                ctx.fillStyle = '#ddd';
                ctx.fillRect(screenX, screenY, this.width, this.height);

                // Pole highlights
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX + 2, screenY, 3, this.height);

                // Pole segments
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY + (i * 50));
                    ctx.lineTo(screenX + this.width, screenY + (i * 50));
                    ctx.stroke();
                }

                // Raise flag up if activated
                if (this.isRising && this.flagY > 10) {
                    this.flagY -= this.riseSpeed;
                }

                // Waving flag effect (only if not rising)
                const wave = this.isRising ? 0 : Math.sin(this.waveOffset) * 3;
                if (!this.isRising) {
                    this.waveOffset += 0.1;
                }

                // Flag shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(screenX + this.width + 2 + wave, screenY + this.flagY + 2, this.flagWidth, this.flagHeight);

                // Main flag (Mario colors - red background)
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(screenX + this.width + wave, screenY + this.flagY, this.flagWidth, this.flagHeight);

                // Mario "M" emblem
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px Courier New';
                ctx.fillText('M', screenX + this.width + wave + 18, screenY + this.flagY + 30);

                // Flag border
                ctx.strokeStyle = '#cc0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(screenX + this.width + wave, screenY + this.flagY, this.flagWidth, this.flagHeight);

                // Pole top ball
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(screenX + this.width / 2, screenY - 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            checkReached(player) {
                return player.x + player.width > this.x && player.x < this.x + this.width + this.flagWidth;
            }

            startRising() {
                if (!this.isRising) {
                    this.isRising = true;
                    this.reached = true;
                }
            }

            isAtTop() {
                return this.flagY <= 10;
            }
        }

        // Bowser Flag class - flag slides down when touched
        class BowserFlag {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 12;
                this.height = 250;
                this.flagWidth = 60;
                this.flagHeight = 40;
                this.waveOffset = 0;
                this.flagY = 10; // Flag starts at top
                this.isSliding = false;
                this.slideSpeed = 3;
                this.playerSliding = null;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Pole base
                ctx.fillStyle = '#888';
                ctx.fillRect(screenX - 8, screenY + this.height, 28, 15);

                // Pole shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(screenX + 2, screenY + 2, this.width, this.height);

                // Main pole
                ctx.fillStyle = '#ddd';
                ctx.fillRect(screenX, screenY, this.width, this.height);

                // Pole highlights
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX + 2, screenY, 3, this.height);

                // Pole segments
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY + (i * 50));
                    ctx.lineTo(screenX + this.width, screenY + (i * 50));
                    ctx.stroke();
                }

                // Slide flag down if activated
                if (this.isSliding && this.flagY < this.height - this.flagHeight - 20) {
                    this.flagY += this.slideSpeed;
                }

                // Waving flag effect (only if not sliding)
                const wave = this.isSliding ? 0 : Math.sin(this.waveOffset) * 3;
                if (!this.isSliding) {
                    this.waveOffset += 0.1;
                }

                // Flag shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(screenX + this.width + 2 + wave, screenY + this.flagY + 2, this.flagWidth, this.flagHeight);

                // Main flag (Bowser colors - black background)
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(screenX + this.width + wave, screenY + this.flagY, this.flagWidth, this.flagHeight);

                // Bowser emblem - red circle
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(screenX + this.width + wave + 30, screenY + this.flagY + 20, 14, 0, Math.PI * 2);
                ctx.fill();

                // Bowser symbol - spikes/horns
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(screenX + this.width + wave + 30, screenY + this.flagY + 10);
                ctx.lineTo(screenX + this.width + wave + 25, screenY + this.flagY + 16);
                ctx.lineTo(screenX + this.width + wave + 30, screenY + this.flagY + 14);
                ctx.lineTo(screenX + this.width + wave + 35, screenY + this.flagY + 16);
                ctx.fill();

                // Flag border
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(screenX + this.width + wave, screenY + this.flagY, this.flagWidth, this.flagHeight);

                // Pole top ball
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(screenX + this.width / 2, screenY - 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            checkReached(player) {
                return player.x + player.width > this.x && player.x < this.x + this.width + this.flagWidth;
            }

            startSliding(player) {
                if (!this.isSliding) {
                    this.isSliding = true;
                    this.playerSliding = player;
                }
            }

            updatePlayerSliding() {
                if (this.playerSliding && this.isSliding) {
                    // Position player on pole
                    this.playerSliding.x = this.x + this.width / 2 - this.playerSliding.width / 2;
                    this.playerSliding.y = this.y + this.flagY + this.flagHeight / 2;
                    this.playerSliding.velocityX = 0;
                    this.playerSliding.velocityY = 0;
                    this.playerSliding.slidingFlag = true;

                    // Stop sliding when reached bottom
                    if (this.flagY >= this.height - this.flagHeight - 20) {
                        this.playerSliding.slidingFlag = false;
                        this.playerSliding = null;
                    }
                }
            }

            isAtBottom() {
                return this.flagY >= this.height - this.flagHeight - 20;
            }
        }

        // Castle class
        class Castle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 200;
                this.height = 180;
                this.doorX = 70;
                this.doorY = 120;
                this.doorWidth = 60;
                this.doorHeight = 60;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Main castle body
                ctx.fillStyle = '#888';
                ctx.fillRect(screenX, screenY + 60, this.width, this.height - 60);

                // Castle towers (left and right)
                ctx.fillRect(screenX - 30, screenY, 50, this.height);
                ctx.fillRect(screenX + this.width - 20, screenY, 50, this.height);

                // Tower tops
                ctx.fillStyle = '#aa0000';
                ctx.fillRect(screenX - 30, screenY, 50, 30);
                ctx.fillRect(screenX + this.width - 20, screenY, 50, 30);
                ctx.fillRect(screenX + 40, screenY + 30, 120, 30);

                // Crenellations
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(screenX - 30 + (i * 20), screenY - 10, 10, 10);
                    ctx.fillRect(screenX + this.width - 20 + (i * 20), screenY - 10, 10, 10);
                }

                // Door
                ctx.fillStyle = '#000';
                ctx.fillRect(screenX + 70, screenY + 120, 60, 60);

                // Door arch
                ctx.beginPath();
                ctx.arc(screenX + 100, screenY + 120, 30, Math.PI, 0);
                ctx.fill();

                // Windows
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(screenX + 30, screenY + 80, 20, 25);
                ctx.fillRect(screenX + 150, screenY + 80, 20, 25);
                ctx.fillRect(screenX - 20, screenY + 40, 15, 20);
                ctx.fillRect(screenX + this.width - 10, screenY + 40, 15, 20);

                // Window crosses
                ctx.fillStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX + 30, screenY + 80, 20, 25);
                ctx.strokeRect(screenX + 150, screenY + 80, 20, 25);
            }

            checkEntry(player) {
                // Check if player is in front of the door
                const doorAbsoluteX = this.x + this.doorX;
                const doorAbsoluteY = this.y + this.doorY;

                return player.x + player.width > doorAbsoluteX &&
                       player.x < doorAbsoluteX + this.doorWidth &&
                       player.y + player.height >= doorAbsoluteY + this.doorHeight - 10;
            }
        }

        // Firework class
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.exploded = false;
                this.age = 0;

                // Create explosion particles
                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 * i) / 30;
                    const speed = 2 + Math.random() * 2;
                    this.particles.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'][Math.floor(Math.random() * 5)]
                    });
                }
            }

            update() {
                this.age++;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1; // Gravity
                });
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                this.particles.forEach(p => {
                    const alpha = Math.max(0, 1 - this.age / 60);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(screenX + p.x, screenY + p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }

            isDead() {
                return this.age > 60;
            }
        }

        // Question Block class
        class QuestionBlock {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.hit = false;
                this.bounceOffset = 0;
                this.bouncing = false;
                this.bounceSpeed = 0;
                this.coins = 1;
                this.animationFrame = 0;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y + this.bounceOffset;

                // Only draw if on screen
                if (screenX + this.width < 0 || screenX > canvas.width) return;

                if (!this.hit) {
                    // Active question block - yellow/gold
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(screenX, screenY, this.width, this.height);

                    // Border
                    ctx.strokeStyle = '#ff9900';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(screenX, screenY, this.width, this.height);

                    // Inner border detail
                    ctx.strokeStyle = '#ffff66';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX + 4, screenY + 4, this.width - 8, this.height - 8);

                    // Question mark
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 28px Courier New';
                    const questionMark = '?';
                    ctx.fillText(questionMark, screenX + 11, screenY + 30);

                    // Animate shimmer
                    this.animationFrame += 0.1;
                    if (Math.sin(this.animationFrame) > 0.5) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(screenX + 2, screenY + 2, 10, 10);
                    }
                } else {
                    // Used block - brown/gray
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(screenX, screenY, this.width, this.height);

                    // Border
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(screenX, screenY, this.width, this.height);

                    // Darker inner rectangle
                    ctx.fillStyle = '#6B4810';
                    ctx.fillRect(screenX + 4, screenY + 4, this.width - 8, this.height - 8);
                }

                // Handle bounce animation
                if (this.bouncing) {
                    this.bounceOffset += this.bounceSpeed;
                    this.bounceSpeed += 0.8;
                    if (this.bounceOffset >= 0) {
                        this.bounceOffset = 0;
                        this.bounceSpeed = 0;
                        this.bouncing = false;
                    }
                }
            }

            checkHit(player) {
                if (this.hit) return false;

                // Check if player hits block from below
                const playerTop = player.y;
                const playerBottom = player.y + player.height;
                const blockBottom = this.y + this.height;

                if (player.velocityY < 0 &&
                    player.x + player.width > this.x &&
                    player.x < this.x + this.width &&
                    playerTop <= blockBottom &&
                    playerTop >= this.y) {

                    this.hit = true;
                    this.bouncing = true;
                    this.bounceSpeed = -8;
                    return true;
                }
                return false;
            }

            // Treat as platform when standing on top
            checkCollision(player) {
                return player.x < this.x + this.width &&
                       player.x + player.width > this.x &&
                       player.y < this.y + this.height &&
                       player.y + player.height > this.y;
            }
        }

        // Create player (Mario)
        const mario = new Player(100, 100, '#ff0000');

        // Create long level with platforms
        const platforms = [
            // Ground sections - all pits covered!
            new Platform(0, 550, LEVEL_WIDTH, 50, '#8B4513'),

            // Floating platforms
            new Platform(250, 450, 100, 20, '#ff8800'),
            new Platform(450, 400, 120, 20, '#ff8800'),
            new Platform(650, 350, 100, 20, '#ff8800'),
            new Platform(850, 450, 150, 20, '#ff8800'),

            new Platform(1100, 400, 120, 20, '#ff8800'),
            new Platform(1300, 300, 100, 20, '#ff8800'),
            new Platform(1500, 450, 150, 20, '#ff8800'),
            new Platform(1750, 350, 100, 20, '#ff8800'),

            new Platform(2050, 400, 140, 20, '#ff8800'),
            new Platform(2300, 300, 120, 20, '#ff8800'),
            new Platform(2500, 250, 100, 20, '#ff8800'),
            new Platform(2750, 400, 150, 20, '#ff8800'),

            new Platform(3000, 350, 120, 20, '#ff8800'),
            new Platform(3300, 450, 100, 20, '#ff8800'),
            new Platform(3500, 300, 140, 20, '#ff8800'),
            new Platform(3750, 400, 120, 20, '#ff8800'),

            new Platform(4000, 350, 100, 20, '#ff8800'),
            new Platform(4200, 450, 150, 20, '#ff8800'),
            new Platform(4450, 300, 120, 20, '#ff8800'),
            new Platform(4700, 400, 140, 20, '#ff8800'),

            // Higher platforms
            new Platform(1200, 200, 100, 20, '#ff8800'),
            new Platform(2200, 150, 100, 20, '#ff8800'),
            new Platform(3400, 180, 120, 20, '#ff8800'),
            new Platform(4500, 200, 100, 20, '#ff8800'),

            // Gap challenges
            new Platform(1800, 500, 80, 20, '#ff8800'),
            new Platform(3100, 500, 80, 20, '#ff8800'),

            // Stairs leading to flags (repositioned before flags)
            new Platform(5200, 530, 60, 20, '#00aa00'),
            new Platform(5260, 510, 60, 40, '#00aa00'),
            new Platform(5320, 490, 60, 60, '#00aa00'),
            new Platform(5380, 470, 60, 80, '#00aa00'),
            new Platform(5440, 450, 60, 100, '#00aa00'),
            new Platform(5500, 430, 60, 120, '#00aa00'),
            new Platform(5560, 410, 60, 140, '#00aa00'),
            new Platform(5620, 390, 60, 160, '#00aa00'),
        ];

        // Create many coins throughout the level
        const coins = [];
        for (let i = 0; i < 80; i++) {
            const x = 300 + (i * 70);
            const y = 200 + Math.sin(i * 0.5) * 100;
            coins.push(new Coin(x, y));
        }

        // Additional coins on platforms
        platforms.forEach((platform, index) => {
            if (platform.color === '#ff8800' && index % 2 === 0) {
                coins.push(new Coin(platform.x + platform.width / 2, platform.y - 30));
            }
        });

        // Create question blocks throughout the level
        const questionBlocks = [
            new QuestionBlock(400, 350),
            new QuestionBlock(550, 500),
            new QuestionBlock(800, 300),
            new QuestionBlock(950, 400),

            new QuestionBlock(1200, 350),
            new QuestionBlock(1400, 250),
            new QuestionBlock(1650, 300),
            new QuestionBlock(1900, 450),

            new QuestionBlock(2100, 350),
            new QuestionBlock(2350, 250),
            new QuestionBlock(2600, 200),
            new QuestionBlock(2850, 350),

            new QuestionBlock(3100, 300),
            new QuestionBlock(3250, 400),
            new QuestionBlock(3600, 250),
            new QuestionBlock(3850, 350),

            new QuestionBlock(4100, 300),
            new QuestionBlock(4350, 400),
            new QuestionBlock(4550, 250),
            new QuestionBlock(4800, 350),

            // Additional blocks near platforms for easier access
            new QuestionBlock(700, 300),
            new QuestionBlock(1550, 400),
            new QuestionBlock(2450, 200),
            new QuestionBlock(3450, 250),
        ];

        // Create Bowser flag (slides down when touched)
        const bowserFlag = new BowserFlag(5700, 300);

        // Create Mario flag (rises up when both flags touched)
        const marioFlag = new Flag(5820, 300);

        // Create castle at the end
        const castle = new Castle(LEVEL_WIDTH - 250, 370);

        // Event listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R') {
                location.reload();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Draw clouds in background
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';

            for (let i = 0; i < 20; i++) {
                const baseX = (i * 400) - (camera.x * 0.5); // Parallax effect
                const y = 60 + (i % 3) * 50;

                ctx.beginPath();
                ctx.arc(baseX, y, 30, 0, Math.PI * 2);
                ctx.arc(baseX + 30, y, 40, 0, Math.PI * 2);
                ctx.arc(baseX + 60, y, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background elements
            drawClouds();

            // Update and draw platforms
            platforms.forEach(platform => platform.draw());

            // Update and draw question blocks
            questionBlocks.forEach(block => block.draw());

            // Update and draw coins
            coins.forEach(coin => {
                if (coin.checkCollection(mario)) {
                    score += 10;
                }
                coin.draw();
            });

            // Draw castle
            castle.draw();

            // Draw Bowser flag
            bowserFlag.draw();

            // Draw Mario flag
            marioFlag.draw();

            // Check if player reached Bowser flag and start sliding
            if (bowserFlag.checkReached(mario) && !bowserFlag.isSliding) {
                bowserFlag.startSliding(mario);
            }

            // Update Bowser flag sliding animation
            bowserFlag.updatePlayerSliding();

            // When Bowser flag reaches bottom, start Mario flag rising
            if (bowserFlag.isAtBottom() && !marioFlag.isRising) {
                marioFlag.startRising();
            }

            // Check if player reached Mario flag and both flags completed
            if (marioFlag.checkReached(mario) && !flagReached && bowserFlag.isAtBottom()) {
                flagReached = true;
            }

            // When Mario flag reaches top, start Mario auto-run
            if (flagReached && marioFlag.isAtTop() && !marioRunning) {
                marioRunning = true;
            }

            // Check if Mario entered castle
            if (marioRunning && castle.checkEntry(mario) && !marioInCastle) {
                marioInCastle = true;
            }

            // When Mario enters castle, trigger level complete
            if (marioInCastle && !levelComplete) {
                levelComplete = true;
                gameTime = Math.floor((Date.now() - gameStartTime) / 1000);

                // Create fireworks
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        fireworks.push(new Firework(
                            LEVEL_WIDTH - 400 + Math.random() * 300,
                            150 + Math.random() * 200
                        ));
                    }, i * 400);
                }
            }

            // Update and draw fireworks
            fireworks = fireworks.filter(fw => !fw.isDead());
            fireworks.forEach(fw => {
                fw.update();
                fw.draw();
            });

            // Update and draw player (hide if in castle)
            mario.update();
            if (!marioInCastle) {
                mario.draw();
            }

            // Draw UI
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Courier New';
            ctx.fillText(`Score: ${score}`, 20, 30);

            // Draw timer
            if (!levelComplete) {
                const currentTime = Math.floor((Date.now() - gameStartTime) / 1000);
                ctx.fillText(`Time: ${currentTime}s`, canvas.width - 200, 60);
            } else {
                ctx.fillText(`Time: ${gameTime}s`, canvas.width - 200, 60);
            }

            // Draw lives (hearts)
            ctx.fillText(`Lives: `, 20, 60);
            for (let i = 0; i < lives; i++) {
                ctx.fillStyle = '#ff0000';
                ctx.fillText('♥', 100 + (i * 25), 60);
            }
            ctx.fillStyle = '#fff';

            // Draw deaths counter
            ctx.fillText(`Deaths: ${deaths}`, 20, 90);

            // Draw distance indicator
            const distance = Math.floor((mario.x / LEVEL_WIDTH) * 100);
            ctx.fillText(`Progress: ${distance}%`, canvas.width - 200, 30);

            // Level complete message
            if (levelComplete) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 48px Courier New';
                ctx.fillText('LEVEL COMPLETE!', canvas.width / 2 - 250, canvas.height / 2);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Courier New';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2 - 120, canvas.height / 2 + 50);
                ctx.fillText(`Completion Time: ${gameTime}s`, canvas.width / 2 - 150, canvas.height / 2 + 80);
                ctx.fillText(`Deaths: ${deaths}`, canvas.width / 2 - 70, canvas.height / 2 + 110);
                ctx.fillText(`Lives Remaining: ${lives}`, canvas.width / 2 - 140, canvas.height / 2 + 140);
                ctx.fillText('Press R to restart', canvas.width / 2 - 140, canvas.height / 2 + 180);
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
