<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Bros Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #5c94fc 0%, #5c94fc 70%, #000 70%);
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            border: 4px solid #000;
            background: #5c94fc;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #info {
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
        .controls {
            color: white;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="info">
            <div>Player 1 (Mario): Arrow Keys to move, Space to jump</div>
            <div>Player 2 (Luigi): WASD to move, Q to jump</div>
        </div>
        <div class="controls">Press R to restart</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const GRAVITY = 0.5;
        const JUMP_STRENGTH = -12;
        const MOVE_SPEED = 5;
        const PLAYER_WIDTH = 32;
        const PLAYER_HEIGHT = 48;

        // Keys pressed
        const keys = {};

        // Player class
        class Player {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.width = PLAYER_WIDTH;
                this.height = PLAYER_HEIGHT;
                this.velocityX = 0;
                this.velocityY = 0;
                this.color = color;
                this.controls = controls;
                this.onGround = false;
                this.direction = 1; // 1 for right, -1 for left
            }

            draw() {
                // Body (overalls)
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(this.x + 8, this.y + 20, 16, 20);

                // Head (skin)
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(this.x + 8, this.y + 8, 16, 12);

                // Hat
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + 6, this.y + 4, 20, 8);

                // Shirt under overalls
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + 8, this.y + 20, 16, 6);

                // Legs
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(this.x + 10, this.y + 40, 6, 8);
                ctx.fillRect(this.x + 18, this.y + 40, 6, 8);

                // Shoes
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x + 8, this.y + 44, 8, 4);
                ctx.fillRect(this.x + 16, this.y + 44, 8, 4);

                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 10, this.y + 12, 3, 3);
                ctx.fillRect(this.x + 19, this.y + 12, 3, 3);

                // Mustache
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 8, this.y + 18, 16, 2);

                // Arms
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + 4, this.y + 24, 4, 10);
                ctx.fillRect(this.x + 24, this.y + 24, 4, 10);
            }

            update() {
                // Handle input
                if (keys[this.controls.left]) {
                    this.velocityX = -MOVE_SPEED;
                    this.direction = -1;
                } else if (keys[this.controls.right]) {
                    this.velocityX = MOVE_SPEED;
                    this.direction = 1;
                } else {
                    this.velocityX = 0;
                }

                if (keys[this.controls.jump] && this.onGround) {
                    this.velocityY = JUMP_STRENGTH;
                    this.onGround = false;
                }

                // Apply gravity
                this.velocityY += GRAVITY;

                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Keep in bounds (horizontal)
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

                // Reset if fell off screen
                if (this.y > canvas.height) {
                    this.y = 100;
                    this.velocityY = 0;
                }

                // Check collision with platforms
                this.onGround = false;
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        // Top collision (landing on platform)
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;
                        }
                        // Bottom collision (hitting head)
                        else if (this.velocityY < 0 && this.y - this.velocityY >= platform.y + platform.height) {
                            this.y = platform.y + platform.height;
                            this.velocityY = 0;
                        }
                        // Side collisions
                        else {
                            if (this.velocityX > 0) {
                                this.x = platform.x - this.width;
                            } else if (this.velocityX < 0) {
                                this.x = platform.x + platform.width;
                            }
                        }
                    }
                });
            }

            checkCollision(platform) {
                return this.x < platform.x + platform.width &&
                       this.x + this.width > platform.x &&
                       this.y < platform.y + platform.height &&
                       this.y + this.height > platform.y;
            }
        }

        // Platform class
        class Platform {
            constructor(x, y, width, height, color = '#8B4513') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
            }

            draw() {
                // Main platform
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Add brick pattern
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                const brickWidth = 40;
                const brickHeight = 20;

                for (let x = 0; x < this.width; x += brickWidth) {
                    for (let y = 0; y < this.height; y += brickHeight) {
                        ctx.strokeRect(this.x + x, this.y + y, brickWidth, brickHeight);
                    }
                }
            }
        }

        // Create players
        const mario = new Player(100, 100, '#ff0000', {
            left: 'ArrowLeft',
            right: 'ArrowRight',
            jump: ' '
        });

        const luigi = new Player(200, 100, '#00ff00', {
            left: 'a',
            right: 'd',
            jump: 'q'
        });

        // Create platforms
        const platforms = [
            new Platform(0, 550, 800, 50, '#8B4513'),           // Ground
            new Platform(150, 450, 200, 20, '#ff8800'),         // Platform 1
            new Platform(450, 400, 150, 20, '#ff8800'),         // Platform 2
            new Platform(100, 300, 150, 20, '#ff8800'),         // Platform 3
            new Platform(400, 250, 200, 20, '#ff8800'),         // Platform 4
            new Platform(250, 150, 150, 20, '#ff8800'),         // Platform 5
            new Platform(650, 350, 100, 20, '#ff8800'),         // Platform 6
        ];

        // Coins
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.collected = false;
            }

            draw() {
                if (!this.collected) {
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            checkCollection(player) {
                if (!this.collected) {
                    const dx = this.x - (player.x + player.width / 2);
                    const dy = this.y - (player.y + player.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < this.radius + player.width / 2) {
                        this.collected = true;
                        return true;
                    }
                }
                return false;
            }
        }

        // Create coins
        const coins = [
            new Coin(250, 420),
            new Coin(525, 370),
            new Coin(175, 270),
            new Coin(500, 220),
            new Coin(325, 120),
            new Coin(700, 320),
        ];

        let score = 0;

        // Event listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R') {
                location.reload();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background elements (clouds)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 30, 0, Math.PI * 2);
            ctx.arc(130, 80, 40, 0, Math.PI * 2);
            ctx.arc(160, 80, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(600, 120, 35, 0, Math.PI * 2);
            ctx.arc(635, 120, 45, 0, Math.PI * 2);
            ctx.arc(675, 120, 35, 0, Math.PI * 2);
            ctx.fill();

            // Update and draw platforms
            platforms.forEach(platform => platform.draw());

            // Update and draw coins
            coins.forEach(coin => {
                if (coin.checkCollection(mario) || coin.checkCollection(luigi)) {
                    score += 10;
                }
                coin.draw();
            });

            // Update and draw players
            mario.update();
            mario.draw();

            luigi.update();
            luigi.draw();

            // Draw score
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Courier New';
            ctx.fillText(`Score: ${score}`, 20, 30);

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
