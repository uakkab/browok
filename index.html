<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario and Luigi Brotherships</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #5c94fc 0%, #5c94fc 70%, #000 70%);
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            border: 4px solid #000;
            background: #5c94fc;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #info {
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
        .controls {
            color: white;
            margin-top: 10px;
            font-size: 12px;
        }
        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
        }
        .authors {
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .authors-title {
            font-weight: bold;
            color: #ffff00;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="title">MARIO AND LUIGI BROTHERSHIPS</div>
        <div class="authors">
            <div class="authors-title">Created by:</div>
            <div>Mohammad Musa</div>
            <div>Abdul Haadi</div>
            <div>Abdul Rafay</div>
            <div>Khursheed Ahmad</div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="info">
            <div>Arrow Keys: Move | Space: Jump | X: Fireball (when big) | I: Fullscreen</div>
            <div>Hit question blocks for coins and mushrooms! Stomp or burn Goombas!</div>
        </div>
        <div class="controls">Press R to restart | Reach both flags at the end!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const GRAVITY = 0.5;
        const JUMP_STRENGTH = -12;
        const MOVE_SPEED = 5;
        const PLAYER_WIDTH = 32;
        const PLAYER_HEIGHT = 48;
        const LEVEL_WIDTH = 6000; // Long level

        // Camera
        let camera = {
            x: 0,
            y: 0
        };

        // Keys pressed
        const keys = {};

        // Game state
        let score = 0;
        let levelComplete = false;
        let lives = 3;
        let deaths = 0;
        let lastSafePosition = { x: 100, y: 100 };
        let flagReached = false;
        let marioRunning = false;
        let fireworks = [];
        let gameStartTime = Date.now();
        let gameTime = 0;
        let marioInCastle = false;
        let isFullscreen = false;

        // Player class
        class Player {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.width = PLAYER_WIDTH;
                this.height = PLAYER_HEIGHT;
                this.velocityX = 0;
                this.velocityY = 0;
                this.color = color;
                this.onGround = false;
                this.direction = 1;
                this.slidingFlag = false;
                this.animationFrame = 0;
                this.isBig = false;
                this.enteringCastle = false;
                this.castleEntryProgress = 0;
                this.fireballCooldown = 0;
            }

            shootFireball() {
                if (this.fireballCooldown > 0 || !this.isBig) return;

                const fireballX = this.direction === 1 ? this.x + this.width : this.x;
                const fireballY = this.y + this.height / 2;
                fireballs.push(new Fireball(fireballX, fireballY, this.direction));
                this.fireballCooldown = 30; // Cooldown frames
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Update animation frame when moving
                if (Math.abs(this.velocityX) > 0 && this.onGround) {
                    this.animationFrame += 0.2;
                }

                const legOffset = Math.sin(this.animationFrame) * 5;
                const armOffset = Math.sin(this.animationFrame + Math.PI) * 4;

                // Scale factor for big Mario
                const scale = this.isBig ? 1.4 : 1;
                const yOffset = this.isBig ? -12 : 0;

                ctx.save();

                // Apply fade effect when entering castle
                if (this.enteringCastle) {
                    ctx.globalAlpha = Math.max(0, 1 - this.castleEntryProgress);
                }

                // Flip horizontally if moving left
                if (this.direction === -1) {
                    ctx.translate(screenX + this.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.translate(-screenX, -screenY);
                }

                // Apply scaling for big Mario
                if (this.isBig) {
                    ctx.translate(screenX + this.width / 2, screenY + this.height);
                    ctx.scale(scale, scale);
                    ctx.translate(-(screenX + this.width / 2), -(screenY + this.height));
                }

                // Hat (red cap) - bigger when powered up
                const hatScale = this.isBig ? 1.8 : 1;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(screenX + 16, screenY + 6 + yOffset, 10 * hatScale, 7 * hatScale, 0, 0, Math.PI * 2);
                ctx.fill();

                // Hat brim
                ctx.beginPath();
                ctx.ellipse(screenX + 16, screenY + 10 + yOffset, 12 * hatScale, 4 * hatScale, 0, 0, Math.PI);
                ctx.fill();

                // Hat badge (M)
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${10 * hatScale}px Arial`;
                ctx.fillText('M', screenX + 13, screenY + 9 + yOffset);

                // Head (round, skin color)
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(screenX + 16, screenY + 18 + yOffset, 9, 0, Math.PI * 2);
                ctx.fill();

                // Ear
                ctx.beginPath();
                ctx.arc(screenX + 24, screenY + 18 + yOffset, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eye (sideways view)
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(screenX + 20, screenY + 16 + yOffset, 4, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.arc(screenX + 21, screenY + 16 + yOffset, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(screenX + 22, screenY + 16 + yOffset, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Eyebrow
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(screenX + 17, screenY + 13 + yOffset);
                ctx.lineTo(screenX + 23, screenY + 13 + yOffset);
                ctx.stroke();

                // Nose
                ctx.fillStyle = '#ffaa88';
                ctx.beginPath();
                ctx.ellipse(screenX + 23, screenY + 19 + yOffset, 3, 4, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Mustache (iconic!)
                ctx.fillStyle = '#4a2511';
                ctx.beginPath();
                ctx.ellipse(screenX + 20, screenY + 22 + yOffset, 7, 3, 0, 0, Math.PI);
                ctx.fill();

                // Sideburns
                ctx.fillStyle = '#4a2511';
                ctx.fillRect(screenX + 10, screenY + 16 + yOffset, 2, 4);

                // Body/Shirt (red)
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(screenX + 10, screenY + 24 + yOffset, 14, 10, 2);
                ctx.fill();

                // Overalls (blue)
                ctx.fillStyle = '#1E90FF';
                ctx.beginPath();
                ctx.roundRect(screenX + 9, screenY + 32 + yOffset, 16, 12, [4, 4, 0, 0]);
                ctx.fill();

                // Overalls straps
                ctx.fillStyle = '#1E90FF';
                ctx.fillRect(screenX + 12, screenY + 26 + yOffset, 3, 8);
                ctx.fillRect(screenX + 18, screenY + 26 + yOffset, 3, 8);

                // Yellow buttons
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(screenX + 13, screenY + 28 + yOffset, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(screenX + 19, screenY + 28 + yOffset, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Arms
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';

                if (!this.onGround) {
                    // Arm up when jumping
                    ctx.beginPath();
                    ctx.moveTo(screenX + 24, screenY + 28 + yOffset);
                    ctx.lineTo(screenX + 28, screenY + 20 + yOffset);
                    ctx.stroke();

                    // Hand
                    ctx.fillStyle = '#ffcc99';
                    ctx.beginPath();
                    ctx.arc(screenX + 28, screenY + 18 + yOffset, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Front arm swinging
                    ctx.beginPath();
                    ctx.moveTo(screenX + 24, screenY + 28 + yOffset);
                    ctx.lineTo(screenX + 26, screenY + 36 + yOffset + armOffset);
                    ctx.stroke();

                    // Front hand
                    ctx.fillStyle = '#ffcc99';
                    ctx.beginPath();
                    ctx.arc(screenX + 26, screenY + 38 + yOffset + armOffset, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Back arm
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(screenX + 10, screenY + 28 + yOffset);
                ctx.lineTo(screenX + 6, screenY + 36 + yOffset - armOffset);
                ctx.stroke();

                // Legs with running animation
                ctx.fillStyle = '#1E90FF';
                ctx.lineWidth = 6;

                // Front leg
                ctx.beginPath();
                ctx.moveTo(screenX + 18, screenY + 43 + yOffset);
                ctx.lineTo(screenX + 18, screenY + 48 + yOffset + legOffset);
                ctx.stroke();

                // Back leg
                ctx.beginPath();
                ctx.moveTo(screenX + 14, screenY + 43 + yOffset);
                ctx.lineTo(screenX + 12, screenY + 48 + yOffset - legOffset);
                ctx.stroke();

                // Shoes (brown boots)
                ctx.fillStyle = '#8B4513';

                // Front shoe
                ctx.beginPath();
                ctx.ellipse(screenX + 20, screenY + 48 + yOffset + legOffset, 6, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Back shoe
                ctx.beginPath();
                ctx.ellipse(screenX + 11, screenY + 48 + yOffset - legOffset, 6, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                // Decrease fireball cooldown
                if (this.fireballCooldown > 0) {
                    this.fireballCooldown--;
                }

                // Don't update if sliding on flag
                if (this.slidingFlag) {
                    return;
                }

                // Handle castle entry animation
                if (this.enteringCastle) {
                    this.castleEntryProgress += 0.02;
                    // Slowly move forward into the door
                    this.velocityX = 1;
                    this.velocityY = 0;
                    this.x += this.velocityX;
                    return;
                }

                // Auto-run to castle when flag is reached
                if (marioRunning) {
                    this.velocityX = MOVE_SPEED;
                    this.direction = 1;
                } else {
                    // Handle input
                    if (keys['ArrowLeft']) {
                        this.velocityX = -MOVE_SPEED;
                        this.direction = -1;
                    } else if (keys['ArrowRight']) {
                        this.velocityX = MOVE_SPEED;
                        this.direction = 1;
                    } else {
                        this.velocityX = 0;
                    }

                    if (keys[' '] && this.onGround) {
                        this.velocityY = JUMP_STRENGTH;
                        this.onGround = false;
                    }
                }

                // Apply gravity
                this.velocityY += GRAVITY;

                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Keep in bounds (horizontal)
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > LEVEL_WIDTH) this.x = LEVEL_WIDTH - this.width;

                // Reset if fell off screen (pit) - continue from same location
                if (this.y > 700) {
                    // Track deaths for statistics
                    deaths++;

                    // Respawn at last safe position
                    this.x = lastSafePosition.x;
                    this.y = lastSafePosition.y;
                    this.velocityX = 0;
                    this.velocityY = 0;
                }

                // Check collision with platforms
                this.onGround = false;
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        // Top collision (landing on platform)
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;

                            // Update last safe position when on ground
                            lastSafePosition.x = this.x;
                            lastSafePosition.y = this.y;
                        }
                        // Bottom collision (hitting head)
                        else if (this.velocityY < 0 && this.y - this.velocityY >= platform.y + platform.height) {
                            this.y = platform.y + platform.height;
                            this.velocityY = 0;
                        }
                        // Side collisions
                        else {
                            if (this.velocityX > 0) {
                                this.x = platform.x - this.width;
                            } else if (this.velocityX < 0) {
                                this.x = platform.x + platform.width;
                            }
                        }
                    }
                });

                // Check collision with question blocks
                questionBlocks.forEach(block => {
                    // Check for hit from below
                    if (block.checkHit(this)) {
                        score += 10;
                    }

                    // Check platform collision (standing on top)
                    if (block.checkCollision(this)) {
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= block.y) {
                            this.y = block.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;

                            // Update last safe position when on ground
                            lastSafePosition.x = this.x;
                            lastSafePosition.y = this.y;
                        }
                    }
                });

                // Update camera to follow player
                camera.x = this.x - canvas.width / 3;
                if (camera.x < 0) camera.x = 0;
                if (camera.x > LEVEL_WIDTH - canvas.width) camera.x = LEVEL_WIDTH - canvas.width;
            }

            checkCollision(platform) {
                return this.x < platform.x + platform.width &&
                       this.x + this.width > platform.x &&
                       this.y < platform.y + platform.height &&
                       this.y + this.height > platform.y;
            }
        }

        // Platform class
        class Platform {
            constructor(x, y, width, height, color = '#8B4513') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Only draw if on screen
                if (screenX + this.width < 0 || screenX > canvas.width) return;

                // Main platform
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX, screenY, this.width, this.height);

                // Add brick pattern
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                const brickWidth = 40;
                const brickHeight = 20;

                for (let x = 0; x < this.width; x += brickWidth) {
                    for (let y = 0; y < this.height; y += brickHeight) {
                        ctx.strokeRect(screenX + x, screenY + y, brickWidth, brickHeight);
                    }
                }
            }
        }

        // Coin class
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.collected = false;
            }

            draw() {
                if (!this.collected) {
                    const screenX = this.x - camera.x;
                    const screenY = this.y - camera.y;

                    // Only draw if on screen
                    if (screenX < -20 || screenX > canvas.width + 20) return;

                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            checkCollection(player) {
                if (!this.collected) {
                    const dx = this.x - (player.x + player.width / 2);
                    const dy = this.y - (player.y + player.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < this.radius + player.width / 2) {
                        this.collected = true;
                        return true;
                    }
                }
                return false;
            }
        }

        // Dual Flag Pole class - both Bowser and Mario flags on same pole
        class DualFlagPole {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 12;
                this.height = 250;
                this.flagWidth = 60;
                this.flagHeight = 40;
                this.waveOffset = 0;

                // Bowser flag starts at top, slides down
                this.bowserFlagY = 10;
                this.bowserSliding = false;

                // Mario flag starts at bottom, rises up
                this.marioFlagY = this.height - this.flagHeight - 10;
                this.marioRising = false;

                this.slideSpeed = 3;
                this.riseSpeed = 3;
                this.playerSliding = null;
                this.reached = false;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Pole base
                ctx.fillStyle = '#888';
                ctx.fillRect(screenX - 8, screenY + this.height, 28, 15);

                // Pole shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(screenX + 2, screenY + 2, this.width, this.height);

                // Main pole
                ctx.fillStyle = '#ddd';
                ctx.fillRect(screenX, screenY, this.width, this.height);

                // Pole highlights
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX + 2, screenY, 3, this.height);

                // Pole segments
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY + (i * 50));
                    ctx.lineTo(screenX + this.width, screenY + (i * 50));
                    ctx.stroke();
                }

                // Slide Bowser flag down if activated
                if (this.bowserSliding && this.bowserFlagY < this.height - this.flagHeight - 20) {
                    this.bowserFlagY += this.slideSpeed;
                }

                // Raise Mario flag up if activated
                if (this.marioRising && this.marioFlagY > 10) {
                    this.marioFlagY -= this.riseSpeed;
                }

                // Waving flag effect (only if not animating)
                const wave = (this.bowserSliding || this.marioRising) ? 0 : Math.sin(this.waveOffset) * 3;
                if (!this.bowserSliding && !this.marioRising) {
                    this.waveOffset += 0.1;
                }

                // Draw Bowser Flag (top)
                // Flag shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(screenX + this.width + 2 + wave, screenY + this.bowserFlagY + 2, this.flagWidth, this.flagHeight);

                // Main flag (Bowser colors - black background)
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(screenX + this.width + wave, screenY + this.bowserFlagY, this.flagWidth, this.flagHeight);

                // Bowser emblem - red circle
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(screenX + this.width + wave + 30, screenY + this.bowserFlagY + 20, 14, 0, Math.PI * 2);
                ctx.fill();

                // Bowser symbol - spikes/horns
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(screenX + this.width + wave + 30, screenY + this.bowserFlagY + 10);
                ctx.lineTo(screenX + this.width + wave + 25, screenY + this.bowserFlagY + 16);
                ctx.lineTo(screenX + this.width + wave + 30, screenY + this.bowserFlagY + 14);
                ctx.lineTo(screenX + this.width + wave + 35, screenY + this.bowserFlagY + 16);
                ctx.fill();

                // Bowser flag border
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(screenX + this.width + wave, screenY + this.bowserFlagY, this.flagWidth, this.flagHeight);

                // Draw Mario Flag (bottom)
                // Flag shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(screenX + this.width + 2 + wave, screenY + this.marioFlagY + 2, this.flagWidth, this.flagHeight);

                // Main flag (Mario colors - red background)
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(screenX + this.width + wave, screenY + this.marioFlagY, this.flagWidth, this.flagHeight);

                // Mario "M" emblem
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px Courier New';
                ctx.fillText('M', screenX + this.width + wave + 18, screenY + this.marioFlagY + 30);

                // Mario flag border
                ctx.strokeStyle = '#cc0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(screenX + this.width + wave, screenY + this.marioFlagY, this.flagWidth, this.flagHeight);

                // Pole top ball
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(screenX + this.width / 2, screenY - 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            checkReached(player) {
                return player.x + player.width > this.x && player.x < this.x + this.width + this.flagWidth;
            }

            startSliding(player) {
                if (!this.bowserSliding) {
                    this.bowserSliding = true;
                    this.playerSliding = player;
                    this.reached = true;
                }
            }

            updatePlayerSliding() {
                if (this.playerSliding && this.bowserSliding) {
                    // Keep player attached to the pole as it slides down
                    this.playerSliding.x = this.x + this.width / 2 - this.playerSliding.width / 2;
                    this.playerSliding.y = this.y + this.bowserFlagY + this.flagHeight / 2;
                    this.playerSliding.velocityX = 0;
                    this.playerSliding.velocityY = 0;
                    this.playerSliding.slidingFlag = true;

                    // Update camera to follow player on pole
                    camera.x = this.playerSliding.x - canvas.width / 3;
                    if (camera.x < 0) camera.x = 0;
                    if (camera.x > LEVEL_WIDTH - canvas.width) camera.x = LEVEL_WIDTH - canvas.width;

                    // Stop sliding when reached bottom
                    if (this.bowserFlagY >= this.height - this.flagHeight - 20) {
                        this.playerSliding.slidingFlag = false;
                        this.playerSliding.y = this.y + this.height - this.playerSliding.height - 5; // Land on ground
                        this.playerSliding = null;
                    }
                }
            }

            startRising() {
                if (!this.marioRising) {
                    this.marioRising = true;
                }
            }

            isBowserAtBottom() {
                return this.bowserFlagY >= this.height - this.flagHeight - 20;
            }

            isMarioAtTop() {
                return this.marioFlagY <= 10;
            }
        }

        // Castle class
        class Castle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 200;
                this.height = 180;
                this.doorX = 70;
                this.doorY = 120;
                this.doorWidth = 60;
                this.doorHeight = 60;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Main castle body
                ctx.fillStyle = '#888';
                ctx.fillRect(screenX, screenY + 60, this.width, this.height - 60);

                // Castle towers (left and right)
                ctx.fillRect(screenX - 30, screenY, 50, this.height);
                ctx.fillRect(screenX + this.width - 20, screenY, 50, this.height);

                // Tower tops
                ctx.fillStyle = '#aa0000';
                ctx.fillRect(screenX - 30, screenY, 50, 30);
                ctx.fillRect(screenX + this.width - 20, screenY, 50, 30);
                ctx.fillRect(screenX + 40, screenY + 30, 120, 30);

                // Crenellations
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(screenX - 30 + (i * 20), screenY - 10, 10, 10);
                    ctx.fillRect(screenX + this.width - 20 + (i * 20), screenY - 10, 10, 10);
                }

                // Door
                ctx.fillStyle = '#000';
                ctx.fillRect(screenX + 70, screenY + 120, 60, 60);

                // Door arch
                ctx.beginPath();
                ctx.arc(screenX + 100, screenY + 120, 30, Math.PI, 0);
                ctx.fill();

                // Windows
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(screenX + 30, screenY + 80, 20, 25);
                ctx.fillRect(screenX + 150, screenY + 80, 20, 25);
                ctx.fillRect(screenX - 20, screenY + 40, 15, 20);
                ctx.fillRect(screenX + this.width - 10, screenY + 40, 15, 20);

                // Window crosses
                ctx.fillStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX + 30, screenY + 80, 20, 25);
                ctx.strokeRect(screenX + 150, screenY + 80, 20, 25);
            }

            checkEntry(player) {
                // Check if player is in front of the door
                const doorAbsoluteX = this.x + this.doorX;
                const doorAbsoluteY = this.y + this.doorY;

                return player.x + player.width > doorAbsoluteX &&
                       player.x < doorAbsoluteX + this.doorWidth &&
                       player.y + player.height >= doorAbsoluteY + this.doorHeight - 10;
            }
        }

        // Firework class
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.exploded = false;
                this.age = 0;

                // Create explosion particles
                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 * i) / 30;
                    const speed = 2 + Math.random() * 2;
                    this.particles.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'][Math.floor(Math.random() * 5)]
                    });
                }
            }

            update() {
                this.age++;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1; // Gravity
                });
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                this.particles.forEach(p => {
                    const alpha = Math.max(0, 1 - this.age / 60);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(screenX + p.x, screenY + p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }

            isDead() {
                return this.age > 60;
            }
        }

        // Mushroom Power-up class
        class Mushroom {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.velocityX = 2;
                this.velocityY = -5; // Pop up from block
                this.collected = false;
                this.onGround = false;
                this.appearingOffset = -this.height; // Start hidden in block
                this.appearing = true;
            }

            draw() {
                if (this.collected) return;

                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y + this.appearingOffset;

                // Mushroom cap (red with white spots)
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(screenX + this.width / 2, screenY + 10, 14, Math.PI, 0);
                ctx.fill();
                ctx.fillRect(screenX + 1, screenY + 10, this.width - 2, 8);

                // White spots on cap
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(screenX + 8, screenY + 8, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(screenX + 22, screenY + 8, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(screenX + 15, screenY + 14, 3, 0, Math.PI * 2);
                ctx.fill();

                // Mushroom stem (white)
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX + 10, screenY + 18, 10, 12);

                // Stem outline
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(screenX + 10, screenY + 18, 10, 12);
            }

            update() {
                if (this.collected) return;

                // Appearing animation
                if (this.appearing) {
                    this.appearingOffset += 1;
                    if (this.appearingOffset >= 0) {
                        this.appearingOffset = 0;
                        this.appearing = false;
                    }
                    return;
                }

                // Apply gravity
                this.velocityY += GRAVITY;

                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Check collision with platforms
                this.onGround = false;
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;
                        }
                        // Bounce off walls
                        else if (this.velocityX > 0 && this.x < platform.x) {
                            this.velocityX = -this.velocityX;
                        } else if (this.velocityX < 0 && this.x + this.width > platform.x + platform.width) {
                            this.velocityX = -this.velocityX;
                        }
                    }
                });

                // Remove if fell off screen
                if (this.y > 700) {
                    this.collected = true;
                }
            }

            checkCollision(platform) {
                return this.x < platform.x + platform.width &&
                       this.x + this.width > platform.x &&
                       this.y < platform.y + platform.height &&
                       this.y + this.height > platform.y;
            }

            checkCollection(player) {
                if (!this.collected && !this.appearing) {
                    const dx = Math.abs((this.x + this.width / 2) - (player.x + player.width / 2));
                    const dy = Math.abs((this.y + this.height / 2) - (player.y + player.height / 2));
                    if (dx < (this.width / 2 + player.width / 2) && dy < (this.height / 2 + player.height / 2)) {
                        this.collected = true;
                        return true;
                    }
                }
                return false;
            }
        }

        // Goomba Enemy class
        class Goomba {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 32;
                this.velocityX = -1.5;
                this.velocityY = 0;
                this.defeated = false;
                this.squashed = false;
                this.squashTimer = 0;
                this.animationFrame = 0;
            }

            draw() {
                if (this.defeated && this.squashTimer > 30) return; // Don't draw after squashed

                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                if (this.squashed) {
                    // Draw squashed Goomba (flat)
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(screenX, screenY + this.height - 8, this.width, 8);
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(screenX + 4, screenY + this.height - 8, this.width - 8, 8);
                } else {
                    // Goomba body (brown mushroom shape)
                    ctx.fillStyle = '#8B4513';

                    // Head/cap
                    ctx.beginPath();
                    ctx.arc(screenX + this.width / 2, screenY + 12, 14, Math.PI, 0);
                    ctx.fill();
                    ctx.fillRect(screenX + 2, screenY + 12, this.width - 4, 10);

                    // Eyes (angry look)
                    ctx.fillStyle = '#fff';
                    const eyeOffset = Math.floor(this.animationFrame) % 2 === 0 ? 0 : 1;
                    ctx.fillRect(screenX + 8, screenY + 10 + eyeOffset, 6, 6);
                    ctx.fillRect(screenX + 18, screenY + 10 + eyeOffset, 6, 6);

                    // Pupils
                    ctx.fillStyle = '#000';
                    ctx.fillRect(screenX + 10, screenY + 12 + eyeOffset, 3, 3);
                    ctx.fillRect(screenX + 20, screenY + 12 + eyeOffset, 3, 3);

                    // Feet (walking animation)
                    ctx.fillStyle = '#654321';
                    const footOffset = Math.sin(this.animationFrame) > 0 ? 2 : -2;
                    ctx.fillRect(screenX + 6 + footOffset, screenY + this.height - 6, 8, 6);
                    ctx.fillRect(screenX + 18 - footOffset, screenY + this.height - 6, 8, 6);
                }
            }

            update() {
                if (this.squashed) {
                    this.squashTimer++;
                    return;
                }

                if (this.defeated) return;

                // Animation
                this.animationFrame += 0.1;

                // Apply gravity
                this.velocityY += GRAVITY;

                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Check collision with platforms
                let onGround = false;
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            onGround = true;
                        }
                        // Turn around at walls
                        else if (this.velocityX > 0 && this.x < platform.x) {
                            this.velocityX = -this.velocityX;
                        } else if (this.velocityX < 0 && this.x + this.width > platform.x + platform.width) {
                            this.velocityX = -this.velocityX;
                        }
                    }
                });

                // Fall off edges (reverse direction)
                if (!onGround && this.y > 700) {
                    this.defeated = true;
                }

                // Turn around at pits (simple edge detection)
                if (onGround) {
                    const nextX = this.x + this.velocityX * 20;
                    let willFall = true;
                    platforms.forEach(platform => {
                        if (nextX + this.width / 2 > platform.x &&
                            nextX + this.width / 2 < platform.x + platform.width &&
                            Math.abs(this.y + this.height - platform.y) < 10) {
                            willFall = false;
                        }
                    });
                    if (willFall) {
                        this.velocityX = -this.velocityX;
                    }
                }
            }

            checkCollision(platform) {
                return this.x < platform.x + platform.width &&
                       this.x + this.width > platform.x &&
                       this.y < platform.y + platform.height &&
                       this.y + this.height > platform.y;
            }

            checkPlayerCollision(player) {
                if (this.defeated) return null;

                const overlap = player.x < this.x + this.width &&
                               player.x + player.width > this.x &&
                               player.y < this.y + this.height &&
                               player.y + player.height > this.y;

                if (overlap) {
                    // Check if player jumped on Goomba
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= this.y + 10) {
                        return 'stomp';
                    } else {
                        return 'hit';
                    }
                }
                return null;
            }

            stomp() {
                this.defeated = true;
                this.squashed = true;
                this.squashTimer = 0;
            }
        }

        // Fireball class
        class Fireball {
            constructor(x, y, direction) {
                this.x = x;
                this.y = y;
                this.width = 12;
                this.height = 12;
                this.velocityX = direction * 8;
                this.velocityY = -3;
                this.bounces = 0;
                this.maxBounces = 3;
                this.active = true;
                this.animationFrame = 0;
            }

            draw() {
                if (!this.active) return;

                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Rotating fireball effect
                this.animationFrame += 0.3;
                const rotation = this.animationFrame;

                ctx.save();
                ctx.translate(screenX + this.width / 2, screenY + this.height / 2);
                ctx.rotate(rotation);

                // Outer glow
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 8);
                gradient.addColorStop(0, '#ffff00');
                gradient.addColorStop(0.5, '#ff6600');
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();

                // Flames
                ctx.fillStyle = '#ff4500';
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i + rotation;
                    const flameX = Math.cos(angle) * 5;
                    const flameY = Math.sin(angle) * 5;
                    ctx.beginPath();
                    ctx.arc(flameX, flameY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            update() {
                if (!this.active) return;

                // Apply gravity
                this.velocityY += GRAVITY * 0.7;

                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Check collision with platforms (bounce)
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        if (this.velocityY > 0 && this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = -6; // Bounce
                            this.bounces++;
                            if (this.bounces >= this.maxBounces) {
                                this.active = false;
                            }
                        }
                    }
                });

                // Remove if off screen or fell
                if (this.x < camera.x - 100 || this.x > camera.x + canvas.width + 100 || this.y > 700) {
                    this.active = false;
                }
            }

            checkCollision(platform) {
                return this.x < platform.x + platform.width &&
                       this.x + this.width > platform.x &&
                       this.y < platform.y + platform.height &&
                       this.y + this.height > platform.y;
            }

            checkEnemyHit(enemy) {
                if (!this.active || enemy.defeated) return false;

                return this.x < enemy.x + enemy.width &&
                       this.x + this.width > enemy.x &&
                       this.y < enemy.y + enemy.height &&
                       this.y + this.height > enemy.y;
            }
        }

        // Question Block class
        class QuestionBlock {
            constructor(x, y, hasMushroom = false) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.hit = false;
                this.bounceOffset = 0;
                this.bouncing = false;
                this.bounceSpeed = 0;
                this.hasMushroom = hasMushroom;
                this.coins = hasMushroom ? 0 : 1;
                this.animationFrame = 0;
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y + this.bounceOffset;

                // Only draw if on screen
                if (screenX + this.width < 0 || screenX > canvas.width) return;

                if (!this.hit) {
                    // Active question block - yellow/gold
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(screenX, screenY, this.width, this.height);

                    // Border
                    ctx.strokeStyle = '#ff9900';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(screenX, screenY, this.width, this.height);

                    // Inner border detail
                    ctx.strokeStyle = '#ffff66';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX + 4, screenY + 4, this.width - 8, this.height - 8);

                    // Question mark
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 28px Courier New';
                    const questionMark = '?';
                    ctx.fillText(questionMark, screenX + 11, screenY + 30);

                    // Animate shimmer
                    this.animationFrame += 0.1;
                    if (Math.sin(this.animationFrame) > 0.5) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(screenX + 2, screenY + 2, 10, 10);
                    }
                } else {
                    // Used block - brown/gray
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(screenX, screenY, this.width, this.height);

                    // Border
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(screenX, screenY, this.width, this.height);

                    // Darker inner rectangle
                    ctx.fillStyle = '#6B4810';
                    ctx.fillRect(screenX + 4, screenY + 4, this.width - 8, this.height - 8);
                }

                // Handle bounce animation
                if (this.bouncing) {
                    this.bounceOffset += this.bounceSpeed;
                    this.bounceSpeed += 0.8;
                    if (this.bounceOffset >= 0) {
                        this.bounceOffset = 0;
                        this.bounceSpeed = 0;
                        this.bouncing = false;
                    }
                }
            }

            checkHit(player) {
                if (this.hit) return false;

                // Check if player hits block from below
                const playerTop = player.y;
                const playerBottom = player.y + player.height;
                const blockBottom = this.y + this.height;

                if (player.velocityY < 0 &&
                    player.x + player.width > this.x &&
                    player.x < this.x + this.width &&
                    playerTop <= blockBottom &&
                    playerTop >= this.y) {

                    this.hit = true;
                    this.bouncing = true;
                    this.bounceSpeed = -8;

                    // Spawn mushroom or coin
                    if (this.hasMushroom) {
                        mushrooms.push(new Mushroom(this.x + this.width / 2 - 15, this.y));
                    }

                    return true;
                }
                return false;
            }

            // Treat as platform when standing on top
            checkCollision(player) {
                return player.x < this.x + this.width &&
                       player.x + player.width > this.x &&
                       player.y < this.y + this.height &&
                       player.y + player.height > this.y;
            }
        }

                mushroom.draw();
            });

            // Update and draw Goombas
            goombas.forEach(goomba => {
                goomba.update();
                const collision = goomba.checkPlayerCollision(mario);
                if (collision === 'stomp') {
                    goomba.stomp();
                    mario.velocityY = -8; // Bounce on enemy
                    score += 50;
                } else if (collision === 'hit' && !mario.enteringCastle && !mario.slidingFlag) {
                    // Mario got hit - shrink if big, otherwise lose a life
                    if (mario.isBig) {
                        mario.isBig = false;
                    } else {
                        deaths++;
                        // Respawn at last safe position
                        mario.x = lastSafePosition.x;
                        mario.y = lastSafePosition.y;
                        mario.velocityX = 0;
                        mario.velocityY = 0;
                    }
                }
                goomba.draw();
            });

            // Update and draw fireballs
            fireballs.forEach(fireball => {
                fireball.update();

                // Check fireball collision with goombas
                goombas.forEach(goomba => {
                    if (fireball.checkEnemyHit(goomba)) {
                        goomba.defeated = true;
                        fireball.active = false;
                        score += 100; // Bonus for fireball kill
                    }
                });

                fireball.draw();
            });
            // Remove inactive fireballs
            fireballs.splice(0, fireballs.length, ...fireballs.filter(f => f.active));

            // Draw castle
            castle.draw();

            // Draw dual flag pole
            dualFlagPole.draw();

            // Check if player reached flag pole and start sliding
            if (dualFlagPole.checkReached(mario) && !dualFlagPole.bowserSliding) {
                dualFlagPole.startSliding(mario);
            }

            // Update flag pole sliding animation
            dualFlagPole.updatePlayerSliding();

            // When Bowser flag reaches bottom, start Mario flag rising
            if (dualFlagPole.isBowserAtBottom() && !dualFlagPole.marioRising) {
                dualFlagPole.startRising();
            }

            // Check if player reached flag and both flags completed
            if (dualFlagPole.checkReached(mario) && !flagReached && dualFlagPole.isBowserAtBottom()) {
                flagReached = true;
            }

            // When Mario flag reaches top, start Mario auto-run
            if (flagReached && dualFlagPole.isMarioAtTop() && !marioRunning) {
                marioRunning = true;
            }

            // Check if Mario entered castle
            if (marioRunning && castle.checkEntry(mario) && !marioInCastle && !mario.enteringCastle) {
                mario.enteringCastle = true;
            }

            // When Mario fully entered castle (animation complete), trigger level complete
            if (mario.enteringCastle && mario.castleEntryProgress >= 1 && !levelComplete) {
                marioInCastle = true;
                levelComplete = true;
                gameTime = Math.floor((Date.now() - gameStartTime) / 1000);

                // Create fireworks
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        fireworks.push(new Firework(
                            LEVEL_WIDTH - 400 + Math.random() * 300,
                            150 + Math.random() * 200
                        ));
                    }, i * 400);
                }
            }

            // Update and draw fireworks
            fireworks = fireworks.filter(fw => !fw.isDead());
            fireworks.forEach(fw => {
                fw.update();
                fw.draw();
            });

            // Update and draw player (always draw, fade happens in draw method)
            mario.update();
            mario.draw();

            // Draw UI
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Courier New';
            ctx.fillText(`Score: ${score}`, 20, 30);

            // Draw timer
            if (!levelComplete) {
                const currentTime = Math.floor((Date.now() - gameStartTime) / 1000);
                ctx.fillText(`Time: ${currentTime}s`, canvas.width - 200, 60);
            } else {
                ctx.fillText(`Time: ${gameTime}s`, canvas.width - 200, 60);
            }

            // Draw lives (hearts)
            ctx.fillText(`Lives: `, 20, 60);
            for (let i = 0; i < lives; i++) {
                ctx.fillStyle = '#ff0000';
                ctx.fillText('♥', 100 + (i * 25), 60);
            }
            ctx.fillStyle = '#fff';

            // Draw deaths counter
            ctx.fillText(`Deaths: ${deaths}`, 20, 90);

            // Draw distance indicator
            const distance = Math.floor((mario.x / LEVEL_WIDTH) * 100);
            ctx.fillText(`Progress: ${distance}%`, canvas.width - 200, 30);

            // Level complete message
            if (levelComplete) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 48px Courier New';
                ctx.fillText('LEVEL COMPLETE!', canvas.width / 2 - 250, canvas.height / 2);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Courier New';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2 - 120, canvas.height / 2 + 50);
                ctx.fillText(`Completion Time: ${gameTime}s`, canvas.width / 2 - 150, canvas.height / 2 + 80);
                ctx.fillText(`Deaths: ${deaths}`, canvas.width / 2 - 70, canvas.height / 2 + 110);
                ctx.fillText(`Lives Remaining: ${lives}`, canvas.width / 2 - 140, canvas.height / 2 + 140);
                ctx.fillText('Press R to restart', canvas.width / 2 - 140, canvas.height / 2 + 180);
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
